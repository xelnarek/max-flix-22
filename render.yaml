services:
  - type: web
    name: paleciaki-pvp
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 120
    envVars:
      - key: NODE_ENV
        value: production
      - key: PVP_ALLOWED_ORIGINS
        value: https://xelnarek.github.io
