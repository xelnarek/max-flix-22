name: Unity 6.6 WebGL and Android build

on:
  # Build a WebGL smoke player automatically whenever the Unity runtime,
  # its validated asset staging pipeline, or this workflow changes on main.
  push:
    branches: [main]
    paths:
      - '.github/workflows/unity-validation.yml'
      - 'scripts/fetch-gobkit-assets.mjs'
      - 'scripts/glbValidation.mjs'
      - 'unity/MaxFlixUnity/**'
  workflow_dispatch:
    inputs:
      target:
        description: Select which Unity player to compile
        type: choice
        required: true
        default: WebGL
        options:
          - WebGL
          - Android APK
          - Android AAB
          - WebGL + Android APK

permissions:
  contents: read

concurrency:
  group: unity-player-build-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'WebGL' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Unity 6.6 • ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'WebGL' }}
    runs-on: ubuntu-latest
    env:
      UNITY_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'WebGL' }}
    timeout-minutes: 120
    steps:
      - name: Checkout Unity project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate Unity and Android signing credentials
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          UNITY_TARGET: ${{ env.UNITY_TARGET }}
        run: |
          if [ -z "${UNITY_LICENSE:-}" ] || [ -z "${UNITY_EMAIL:-}" ] || [ -z "${UNITY_PASSWORD:-}" ]; then
            echo "::error::Unity activation is incomplete. Add UNITY_LICENSE (the .ulf file contents), UNITY_EMAIL and UNITY_PASSWORD in Settings > Secrets and variables > Actions. Never put these values in the repository or chat."
            exit 1
          fi
          if [ "$UNITY_TARGET" = "Android AAB" ]; then
            if [ -z "${ANDROID_UPLOAD_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
              echo "::error::Android AAB requires ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD."
              exit 1
            fi
          fi

      - name: Download and stage validated CC0 operator and enemy rigs
        run: node scripts/fetch-gobkit-assets.mjs --strict --unity

      - name: Cache Unity import and compilation state
        uses: actions/cache@v4
        with:
          path: unity/MaxFlixUnity/Library
          key: unity-6000.6-${{ runner.os }}-${{ env.UNITY_TARGET }}-${{ hashFiles('unity/MaxFlixUnity/Assets/**', 'unity/MaxFlixUnity/Packages/**', 'unity/MaxFlixUnity/ProjectSettings/**') }}
          restore-keys: |
            unity-6000.6-${{ runner.os }}-${{ env.UNITY_TARGET }}-

      - name: Compile Unity Web player (WebGPU with WebGL 2 fallback)
        if: env.UNITY_TARGET == 'WebGL' || env.UNITY_TARGET == 'WebGL + Android APK'
        uses: game-ci/unity-builder@v4.8.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity/MaxFlixUnity
          unityVersion: auto
          targetPlatform: WebGL
          buildName: Paleciaki-Unity-Web
          buildsPath: build/unity
          versioning: None

      - name: Compile Android development APK (ARM64 / IL2CPP)
        if: env.UNITY_TARGET == 'Android APK' || env.UNITY_TARGET == 'WebGL + Android APK'
        uses: game-ci/unity-builder@v4.8.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity/MaxFlixUnity
          unityVersion: auto
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: Paleciaki-Unity-Android
          buildsPath: build/unity
          versioning: None

      - name: Set monotonic Google Play version code
        if: env.UNITY_TARGET == 'Android AAB'
        id: android-version
        shell: bash
        run: echo "code=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Compile signed Google Play App Bundle
        if: env.UNITY_TARGET == 'Android AAB'
        uses: game-ci/unity-builder@v4.8.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity/MaxFlixUnity
          unityVersion: auto
          targetPlatform: Android
          androidExportType: androidAppBundle
          androidKeystoreName: paleciaki-upload-key.jks
          androidKeystoreBase64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEY_ALIAS }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEY_PASSWORD }}
          androidVersionCode: ${{ steps.android-version.outputs.code }}
          buildName: Paleciaki-Unity-Android
          buildsPath: build/unity
          versioning: None

      - name: Upload Unity player artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paleciaki-unity-${{ env.UNITY_TARGET }}-${{ github.run_number }}
          path: build/unity/**
          if-no-files-found: warn
          retention-days: 21
