name: Android QA and Google Play bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'resources/**'
      - 'scripts/prepare-android-release.mjs'
      - 'scripts/verify-android-release.mjs'
      - 'scripts/check-play-store-readiness.mjs'
      - 'tests/play-store-preflight.test.mjs'
      - 'docs/GOOGLE_PLAY_READINESS.md'
      - 'docs/GOOGLE_PLAY_NEXT_STEPS_PL.md'
      - 'play-store/listing-pl.json'
      - 'public/manifest.webmanifest'
      - 'scripts/prepare-play-store-artwork.mjs'
      - '.github/workflows/android-release.yml'

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android API 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Run automated tests
        run: npm test

      - name: Google Play metadata preflight
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          VITE_ADMOB_REWARDED_ID: ${{ vars.VITE_ADMOB_REWARDED_ID }}
          VITE_ADMOB_INTERSTITIAL_ID: ${{ vars.VITE_ADMOB_INTERSTITIAL_ID }}
        run: npm run play:preflight

      - name: TypeScript validation
        run: npm run lint

      - name: Build web game
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          VITE_ADMOB_REWARDED_ID: ${{ vars.VITE_ADMOB_REWARDED_ID }}
          VITE_ADMOB_INTERSTITIAL_ID: ${{ vars.VITE_ADMOB_INTERSTITIAL_ID }}
        run: npm run build

      - name: Install pinned Capacitor toolchain
        run: npm install --no-save --package-lock=false @capacitor/core@8.6.0 @capacitor/cli@8.6.0 @capacitor/android@8.6.0 @capacitor/assets@3.0.5

      - name: Prepare Android source artwork
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick
          rsvg-convert -w 1024 -h 1024 resources/icon-only.svg > resources/icon-only.png
          rsvg-convert -w 1024 -h 1024 resources/icon-foreground.svg > resources/icon-foreground.png
          rsvg-convert -w 1024 -h 1024 resources/icon-background.svg > resources/icon-background.png
          rsvg-convert -w 2732 -h 2732 resources/splash.svg > resources/splash.png
          node scripts/prepare-play-store-artwork.mjs

      - name: Create and sync native Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate Android launcher and splash assets
        run: npx capacitor-assets generate --android

      - name: Configure Android package, version and optional signing
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: '0.1.0'
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
        run: |
          if [ -n "${ANDROID_UPLOAD_KEYSTORE_BASE64:-}" ]; then
            if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
              echo "Android signing secrets are incomplete." >&2
              exit 1
            fi
            export ANDROID_UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/paleciaki-upload-key.jks"
            printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_UPLOAD_KEYSTORE_PATH"
            echo "ANDROID_UPLOAD_KEYSTORE_PATH=$ANDROID_UPLOAD_KEYSTORE_PATH" >> "$GITHUB_ENV"
          elif [ -n "$ANDROID_KEYSTORE_PASSWORD$ANDROID_KEY_ALIAS$ANDROID_KEY_PASSWORD" ]; then
            echo "Set all four Android upload signing secrets, including ANDROID_UPLOAD_KEYSTORE_BASE64." >&2
            exit 1
          fi
          node scripts/prepare-android-release.mjs

      - name: Build Android packages
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon bundleRelease assembleDebug assembleRelease

      - name: Verify Android package signatures and SDK metadata
        run: node scripts/verify-android-release.mjs

      - name: Validate Google Play internal-track credentials
        if: vars.GOOGLE_PLAY_UPLOAD_ENABLED == 'true'
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ "$ANDROID_SIGNING_ENABLED" != "true" ]; then
            echo "Google Play upload requires a verified upload-signed AAB." >&2
            exit 1
          fi
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is missing. Configure the Play Developer API service account secret." >&2
            exit 1
          fi

      - name: Upload signed AAB to Google Play internal testing
        if: vars.GOOGLE_PLAY_UPLOAD_ENABLED == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: pl.paleciaki.magazynchaosu
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
          releaseName: Paleciaki-0.1.0-${{ github.run_number }}

      - name: Upload Android QA and release artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paleciaki-android-${{ github.run_number }}-${{ github.sha }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            play-store/generated/app-icon-512.png
            play-store/generated/feature-graphic-1024x500.jpg
            play-store/generated/android-build-report.json
            play-store/generated/release-readiness-report.json
            package-lock.json
          if-no-files-found: warn
          retention-days: 21
