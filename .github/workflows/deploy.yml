name: Deploy Warehouse MaDDnes to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      VITE_PVP_WS_URL: ${{ vars.VITE_PVP_WS_URL }}
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript validation
        run: npm run lint

      - name: Build production website
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload production build
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: github-pages
          path: ./dist

      - name: Wait for Pages artifact metadata
        run: |
          for attempt in $(seq 1 15); do
            artifact_response="$(curl --silent --show-error --fail \
              --request POST \
              --header "Authorization: Bearer ${ACTIONS_RUNTIME_TOKEN}" \
              --header "Content-Type: application/json" \
              "${ACTIONS_RESULTS_URL}/twirp/github.actions.results.api.v1.ArtifactService/ListArtifacts" \
              --data '{}')" || {
                echo "Artifact service temporarily unavailable (attempt $attempt/15)."
                sleep 2
                continue
              }
            artifact_count="$(printf '%s' "$artifact_response" | jq '[.artifacts[]? | select(.name == "github-pages")] | length')"
            if [ "$artifact_count" = "1" ]; then
              echo "GitHub Pages artifact is visible to the same Twirp API used by deploy-pages."
              exit 0
            fi
            if [ "$artifact_count" -gt 1 ]; then
              echo "More than one github-pages artifact is present; refusing an ambiguous deployment." >&2
              exit 1
            fi
            echo "Waiting for Pages artifact indexing (attempt $attempt/15)..."
            sleep 2
          done
          echo "The uploaded Pages artifact is not visible to the deployment artifact service." >&2
          exit 1

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: github-pages
