name: Deploy Warehouse MaDDnes to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      VITE_PVP_WS_URL: ${{ vars.VITE_PVP_WS_URL }}
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript validation
        run: npm run lint

      - name: Build production website
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload production build
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: github-pages
          path: ./dist

      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 10); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .id' | grep -q .; then
              echo "GitHub Pages artifact is visible to the deployment API."
              exit 0
            fi
            echo "Waiting for GitHub Pages artifact indexing (attempt $attempt/10)..."
            sleep 2
          done
          echo "The uploaded GitHub Pages artifact is not visible to the deployment API." >&2
          exit 1

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: github-pages
