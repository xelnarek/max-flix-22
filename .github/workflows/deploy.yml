name: Deploy Warehouse MaDDnes to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      VITE_PVP_WS_URL: ${{ vars.VITE_PVP_WS_URL }}
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript validation
        run: npm run lint

      - name: Build production website
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload production build
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: github-pages
          path: ./dist

      - name: Deploy website
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts")"
          artifact_count="$(printf '%s' "$artifact_json" | jq '[.artifacts[]? | select(.name == "github-pages" and .expired == false)] | length')"
          if [ "$artifact_count" != "1" ]; then
            echo "Expected exactly one unexpired github-pages artifact; found $artifact_count." >&2
            exit 1
          fi
          artifact_id="$(printf '%s' "$artifact_json" | jq -er '[.artifacts[] | select(.name == "github-pages" and .expired == false)][0].id')"

          oidc_response="$(curl --silent --show-error --fail \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")"
          oidc_token="$(printf '%s' "$oidc_response" | jq -er '.value')"

          deployment_payload="$(jq -n \
            --argjson artifact_id "$artifact_id" \
            --arg pages_build_version "$GITHUB_SHA" \
            --arg oidc_token "$oidc_token" \
            '{artifact_id: $artifact_id, environment: "github-pages", pages_build_version: $pages_build_version, oidc_token: $oidc_token}')"
          deployment_response="$(curl --silent --show-error --fail \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --header "Content-Type: application/json" \
            --data "$deployment_payload" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/deployments")"

          deployment_id="$(printf '%s' "$deployment_response" | jq -er '.id')"
          page_url="$(printf '%s' "$deployment_response" | jq -er '.page_url')"
          status_url="$(printf '%s' "$deployment_response" | jq -er '.status_url')"
          echo "page_url=$page_url" >> "$GITHUB_OUTPUT"
          echo "Created GitHub Pages deployment $deployment_id for $GITHUB_SHA."

          for attempt in $(seq 1 60); do
            status_response="$(curl --silent --show-error --fail \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "$status_url")"
            deployment_status="$(printf '%s' "$status_response" | jq -er '.status')"
            if [ "$deployment_status" = "succeed" ]; then
              echo "GitHub Pages deployment succeeded: $page_url"
              exit 0
            fi
            if [ "$deployment_status" = "failure" ] || [ "$deployment_status" = "failed" ] || [ "$deployment_status" = "error" ]; then
              echo "GitHub Pages deployment failed with status: $deployment_status" >&2
              exit 1
            fi
            echo "GitHub Pages deployment status: $deployment_status (attempt $attempt/60)."
            sleep 5
          done
          echo "Timed out waiting for GitHub Pages deployment $deployment_id." >&2
          exit 1
